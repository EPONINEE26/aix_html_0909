<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <title>학생성적프로그램</title>
    <style>
        div{width: 100px; height: 100px; border: 1px solid black; text-align: center;
            margin: 100px; padding: 100px; border-collapse: collapse; border-radius: 50%;
            background: yellow; font-size: 50px; font-weight: 600; position: fixed; 
            overflow: hidden; 
        }
        h2 { text-align: center; }
        table, th, td { border: 1px solid black; border-collapse: collapse; }
        table { width: 1000px; text-align: center; box-sizing: border-box; margin: 50px auto; }
        th { background: #efefef; height: 60px; }
        td { height: 40px; }
        input { margin: 4px 0; }
        .btn { margin: 2px; }
    </style>
</head>
<body>
    <h2>학생성적프로그램</h2>
    <div>
        <input type="text" id="no" placeholder="번호입력"><br>
        <input type="text" id="name" placeholder="이름입력"><br>
        <input type="text" id="kor" placeholder="국어점수입력"><br>
        <input type="text" id="eng" placeholder="영어점수입력"><br>
        <input type="text" id="math" placeholder="수학점수입력"><br>
        <button class="btn" type="button" id="saveBtn">저장</button>
    </div>

    <table>
        <colgroup>
            <col width="10%">
            <col width="15%">
            <col width="10%">
            <col width="10%">
            <col width="10%">
            <col width="10%">
            <col width="10%">
            <col width="10%">
            <col width="15%">
        </colgroup>
        <thead>
            <tr>
                <th>번호</th>
                <th>이름</th>
                <th>국어</th>
                <th>영어</th>
                <th>수학</th>
                <th>합계</th>
                <th>평균</th>
                <th>등수</th>
                <th>버튼</th>
            </tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>

    <script>
        /*
         * 수정 중인 학생의 번호를 기억하는 변수입니다.
         * null이면 새 학생 저장 상태입니다.
         */
        let editingNo = null;


        function calculateAndRenderRow(no, name, kor, eng, math) {
            const total = kor + eng + math;
            const avg = total / 3;

            return {
                total: total,
                avg: avg.toFixed(2)
            };
        }


        function createRow(no, name, kor, eng, math, total, avg) {
            const existing = $("#tbody").find("tr").filter(function() {
                return $(this).attr("data-no") === no;
            });

            if (existing.length > 0) {
                return null;
            }

            const rank = "";

            const tr = $("<tr>")
                .attr("data-no", no)
                .attr("data-total", total);

            $("<td>").text(no).appendTo(tr);
            $("<td>").text(name).appendTo(tr);
            $("<td>").text(kor).appendTo(tr);
            $("<td>").text(eng).appendTo(tr);
            $("<td>").text(math).appendTo(tr);
            $("<td>").text(total).appendTo(tr);
            $("<td>").text(avg).appendTo(tr);
            $("<td>").text(rank).appendTo(tr);

            const buttonTd = $("<td>");

            $("<button>")
                .attr("type", "button")
                .addClass("update btn")
                .text("수정")
                .appendTo(buttonTd);

            $("<button>")
                .attr("type", "button")
                .addClass("delete btn")
                .text("삭제")
                .appendTo(buttonTd);

            buttonTd.appendTo(tr);

            return tr;
        }


        /*
         * 등수 계산
         */
        function updateRank() {
            const rows = $("#tbody tr").get();

            rows.sort(function(a, b) {
                return Number($(b).attr("data-total")) -
                       Number($(a).attr("data-total"));
            });

            rows.forEach(function(row, index) {
                $(row).find("td:eq(7)").text(index + 1);
            });
        }


        /*
         * 입력창 초기화
         */
        function clearInput() {
            $("#no").val("");
            $("#name").val("");
            $("#kor").val("");
            $("#eng").val("");
            $("#math").val("");

            editingNo = null;
            $("#saveBtn").text("저장");
        }


        /*
         * 삭제 버튼
         */
        $(document).on("click", ".delete", function() {
            const tr = $(this).closest("tr");
            const studentName = tr.find("td:eq(1)").text();

            if (confirm(studentName + " 학생을 삭제하시겠습니까?")) {
                tr.remove();

                updateRank();

                /*
                 * 수정 중인 학생을 삭제한 경우
                 */
                if (editingNo === tr.attr("data-no")) {
                    clearInput();
                }

                alert("삭제되었습니다.");
            }
        });


        /*
         * 수정 버튼
         */
        $(document).on("click", ".update", function() {
            const tr = $(this).closest("tr");

            /*
             * 기존 행을 삭제하지 않고
             * 현재 수정할 번호만 기억합니다.
             */
            editingNo = tr.attr("data-no");

            $("#no").val(tr.find("td:eq(0)").text());
            $("#name").val(tr.find("td:eq(1)").text());
            $("#kor").val(tr.find("td:eq(2)").text());
            $("#eng").val(tr.find("td:eq(3)").text());
            $("#math").val(tr.find("td:eq(4)").text());

            $("#saveBtn").text("수정 완료");

            alert("수정할 정보를 입력한 후 '수정 완료' 버튼을 눌러주세요.");
        });


        /*
         * 저장 또는 수정 완료 버튼
         */
        $("#saveBtn").on("click", function() {
            const no = $("#no").val().trim();
            const name = $("#name").val().trim();

            const korText = $("#kor").val().trim();
            const engText = $("#eng").val().trim();
            const mathText = $("#math").val().trim();

            const kor = Number(korText);
            const eng = Number(engText);
            const math = Number(mathText);

            if (!no) {
                alert("번호를 입력해 주세요.");
                return;
            }

            if (!name) {
                alert("이름을 입력해 주세요.");
                return;
            }

            if (
                korText === "" ||
                engText === "" ||
                mathText === "" ||
                isNaN(kor) ||
                isNaN(eng) ||
                isNaN(math)
            ) {
                alert("점수는 숫자로 입력해 주세요.");
                return;
            }


            const result = calculateAndRenderRow(
                no,
                name,
                kor,
                eng,
                math
            );


            /*
             * 수정 상태인 경우
             */
            if (editingNo !== null) {
                const existing = $("#tbody tr").filter(function() {
                    return $(this).attr("data-no") === editingNo;
                });

                if (existing.length === 0) {
                    alert("수정할 학생 정보를 찾을 수 없습니다.");
                    clearInput();
                    return;
                }

                /*
                 * 번호는 기존 번호를 유지합니다.
                 * 같은 행의 이름과 점수만 변경합니다.
                 */
                existing.find("td:eq(1)").text(name);
                existing.find("td:eq(2)").text(kor);
                existing.find("td:eq(3)").text(eng);
                existing.find("td:eq(4)").text(math);
                existing.find("td:eq(5)").text(result.total);
                existing.find("td:eq(6)").text(result.avg);

                existing.attr("data-total", result.total);

                updateRank();

                alert("수정이 완료되었습니다.");

                clearInput();
                return;
            }


            /*
             * 새 학생 저장 상태인 경우
             */
            const duplicate = $("#tbody tr").filter(function() {
                return $(this).attr("data-no") === no;
            });

            if (duplicate.length > 0) {
                alert("이미 등록된 번호입니다.");
                return;
            }

            const tr = createRow(
                no,
                name,
                kor,
                eng,
                math,
                result.total,
                result.avg
            );

            if (tr) {
                $("#tbody").append(tr);
                updateRank();

                alert("학생성적을 저장했습니다.");
                clearInput();
            } else {
                alert("저장 실패: 중복된 번호가 있습니다.");
            }
        });


        /*
         * 입력창 포커스/블러 색상 처리
         */
        $("input").on("focus", function() {
            $(this).css({
                "background": "yellow"
            });
        });

        $("input").on("blur", function() {
            $(this).css({
                "background": ""
            });
        });
    </script>
</body>
</html>
