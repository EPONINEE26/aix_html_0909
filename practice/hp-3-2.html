<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <title>성적 관리 프로그램</title>
    <style>
        h2{text-align: center;}
        table,th,td { border: 1px solid black; border-collapse: collapse; }
        table{width: 1000px; text-align: center; box-sizing: border-box; margin: 50px auto; margin-top: 20px;}        
        th{background: #efefef; height: 60px;} 
        td{height: 40px; }
    </style>
    <script>
        var student = [
            {"no":1, "name":"홍길동", "kor":100, "eng":100, "math":100, "total":300, "avg":100.0, "rank":0},
            {"no":2, "name":"유관순", "kor":100, "eng":100, "math":100, "total":300, "avg":100.0, "rank":0},
            {"no":3, "name":"이순신", "kor":100, "eng":100, "math":100, "total":300, "avg":100.0, "rank":0},
        ]
        
    </script>
</head>
<body>
    <h2>학생성적프로그램</h2>
    <input type="text" name=no" id="no" placeholder="번호입력"><br>  
    <input type="text" name="name" id="name" placeholder="이름입력"><br>
    <input type="text" name="kor" id="kor" placeholder="국어점수입력"><br>
    <input type="text" name="eng" id="eng" placeholder="영어점수입력"><br>
    <input type="text" name="math" id="math" placeholder="수학점수입력"><br>
    <button type="button" onclick="saveBtn()">저장</button> 
    <table>
        <colgroup>
            <col width = "15%">
            <col width = "10%">
            <col width = "10%">
            <col width = "10%">
            <col width = "10%">
            <col width = "10%">
            <col width = "10%">
            <col width = "10%"> 
            <col width = "15%">           
        </colgroup>
        <thead>
            <tr>
                <th>번호</th>
                <th>이름</th>
                <th>국어</th>
                <th>영어</th>
                <th>수학</th>
                <th>합계</th>
                <th>평균</th>
                <th>등수</th>
                <th>버튼</th>
            </tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>
    <script>
        var stu =  ``; 
        for (var i=0;i<=student.length;i++){
            stu += `<tr id="${student[i].no}">
                <td>${student[i].no}></td>
                <td>${student[i].name}</td>
                <td>${student[i].kor}</td> 
                <td>${student[i].eng}</td> 
                <td>${student[i].math}</td> 
                <td>${student[i].total}</td> 
                <td>${student[i].avg}</td> 
                <td>${student[i].rank}</td>
                <td>
                    <button class="update">수정</button>
                    <button class="delete">삭제</button>
                </td>                
                </tr>`; 
        }

            document.getElementById("#tbody").innerHTML = stu;
            $("#tbody").html(stu); 

            if(!name || isNaN(kor) || isNaN(eng) || isNaN(math)) {
                alert("모든 필드를 올바르게 입력해주세요.");
                return;
        }
    </script>
</body>
</html>
