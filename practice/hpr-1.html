<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>사업장별 인증 현황 표</title>      
    <style>        
        table {
            width: 400px;
            border-collapse: collapse; /* 선을 한 줄로 깔끔하게 합치기 */
            text-align: center;        /* 글자 정중앙 정렬 */
            font-family: 'Malgun Gothic', sans-serif;
            font-size: 11px;
            line-height: 1.4;            
            
            border-top: 2px solid #333333;
            border-bottom: 2px solid #333333;
        }        
        td {
            height: 60px;
            border-bottom: 1px solid #e2e2e2; /* 모든 칸 밑에 연한 가로줄 */
            color: #333333;
            padding: 4px;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td>사업장</td>
            <td>인증</td>
            <td>인증기간</td>
        </tr>
        <tr>
            <td>용인연구소</td>
            <td>안전보건경영시스템<br>(ISO 45001)</td>
            <td>2026.02.20~<br>2029.02.19</td>
        </tr>
        <tr>
            <td rowspan="3">구미사업장</td> 
            <td>에너지경영시스템<br>(ISO 50001)</td>
            <td>2024.08.10~<br>2027.08.09</td>
        </tr>
        <tr>
            <td>환경경영시스템<br>(ISO 14001)</td>
            <td>2024.08.18~<br>2027.08.17</td>
        </tr>
        <tr>
            <td>안전보건경영시스템<br>(ISO 45001)</td>
            <td>2024.08.18~<br>2027.08.17</td>
        </tr>
        <tr>
            <td>ICT 부문</td>
            <td>안전보건경영시스템<br>(ISO 45001)</td>
            <td>2025.08.01~<br>2028.07.31</td>
        </tr>
    </table>

</body>
</html>
