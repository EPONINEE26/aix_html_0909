<body> 
    <input type="text" name="name" id="name" placeholder="이름입력">
    <input type="text" name="kor" id="kor"   placeholder="국어입력">
    <input type="text" name="eng" id="eng" placeholder="영어입력">
    <input type="text" name="math" id="math" placeholder="수학입력">
    <input type="text" name="total" id="total" placeholder="합계입력">
    <input type="text" name="avg" id="avg" placeholder="평균입력">    
    <br>
    <button type="button" onclick="saveBtn()">저장</button>
    <table>
        <tr>
            <th>이름</th>
            <th>국어</th>
            <th>영어</th>
            <th>수학</th>
            <th>합계</th>
            <th>평균</th>
            
        </tr>
        <tbody id="tbody"></tbody>
    </table>
    <script>
        var arr = ['홍길동','유관순','이순신'];
        var arr_k = ['100','100','100'];
        var arr_e = ['100','100','100'];
        var arr_m = ['100','100','100'];
        var arr_t = ['300','300','300'];
        var arr_a = ['100','100','100'];

        function saveBtn(){
            var nlist = document.getElementById("tbody");

            var name = document.getElementById("name").value;
            var kor = Number(document.getElementById("kor").value);
            var eng = Number(document.getElementById("eng").value);
            var math = Number(document.getElementById("math").value);

            var total = Number(kor) + Number (eng) + Number (math);
            var avg = parseFloat(total/3).toFixed(2);

            arr.push(name);
            arr_k.push(kor);
            arr_e.push(eng);
            arr_m.push(math);
            arr_t.push(total);
            arr_a.push(avg);

            nlist.innerHTML += `<tr><td>${name}</td><td>${kor}</td><td>${eng}</td><td>${math}</td><td>${total}</td><td>${avg}</td></tr>`;
        }

        var txtHtml =``;
        for (var i=0;i<arr.length;i++){
            txtHtml += `<tr>
                <td>${arr[i]}</td>
                <td>${arr_k[i]}</td>
                <td>${arr_e[i]}</td>
                <td>${arr_m[i]}</td>
                <td>${arr_t[i]}</td>
                <td>${arr_a[i]}</td>
                </tr>`;  
        }
        document.getElementById("tbody").innerHTML = txtHtml; 
      



</script>
