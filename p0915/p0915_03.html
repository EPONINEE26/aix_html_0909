<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin:0; padding:0;}
        section{width:800px; height:800px; border:1px solid black; 
            margin: 50px auto; position: relative; 
        
        }
        div{width:100px; height:100px;
            border:3px solid black; box-sizing: border-box;
        }
        #i1{position: relative; left:700px; }
        #i2{position:relative; left:300px; top:295px; }
        #i3{position: relative; left:245px; top:92px; }
        #i4{position: absolute; left: 700px ; right: 698px; top: 700px}
        #i5{position: relative; left: 350px; top: -7px; }
        #i6{position: relative; left: 0px ; right: 700px; top: 300px;}
        
    </style>
</head>
<body>
    <section>
        <div id="i1">1</div>
        <div id="i2">2</div>
        <div id="i3">3</div>
        <div id="i4">4</div>
        <div id="i5">5</div>
        <div id="i6">6</div>
    </section>
</body>
</html>
