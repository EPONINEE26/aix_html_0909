<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원가입 - 소요림 리조트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --forest-deep:#1F3B2C;
    --forest-mid:#3F6B4F;
    --sand:#EFE8D8;
    --paper:#FBF9F4;
    --wood:#8B5E3C;
    --gold:#B98B2A;
    --ink:#232323;
    --sub:#6B6558;
    --line:#E1D8C4;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Noto Sans KR',sans-serif;background:var(--sand);color:var(--ink);}
  a{text-decoration:none;color:inherit;}

  header{background:var(--forest-deep);color:#fff;}
  .nav-wrap{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:18px 24px;}
  .logo{font-family:'Noto Serif KR',serif;font-size:22px;font-weight:700;}
  .logo span{color:var(--gold);}

  .banner{position:relative;height:220px;overflow:hidden;}
  .banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .banner::after{content:'';position:absolute;inset:0;background:rgba(20,35,24,.45);}
  .banner-text{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;}
  .banner-text h1{font-family:'Noto Serif KR',serif;font-size:28px;margin:0 0 8px;}
  .banner-text p{margin:0;font-size:14px;color:#e6ece6;}

  .steps{display:flex;justify-content:center;gap:0;max-width:520px;margin:34px auto 0;}
  .step{flex:1;text-align:center;position:relative;font-size:13px;color:var(--sub);}
  .step .dot{width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-weight:700;font-size:13px;}
  .step.done .dot{background:var(--forest-deep);border-color:var(--forest-deep);color:#fff;}
  .step.active .dot{border-color:var(--forest-deep);color:var(--forest-deep);}
  .step::before{content:'';position:absolute;top:14px;left:-50%;width:100%;height:2px;background:var(--line);z-index:-1;}
  .step:first-child::before{display:none;}
  .step.done::before, .step.active::before{background:var(--forest-deep);}

  .wrap{max-width:560px;margin:0 auto;padding:40px 24px 90px;}

  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:36px 32px;}
  .card h2{font-family:'Noto Serif KR',serif;font-size:20px;margin:0 0 24px;text-align:center;}

  .field{margin-bottom:18px;}
  .field label{display:block;font-size:13.5px;font-weight:700;margin-bottom:7px;}
  .field .req{color:#c0503f;margin-left:2px;}
  .field input, .field select{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:6px;font-size:14px;font-family:inherit;background:#fdfcf9;}
  .field input:focus, .field select:focus{outline:none;border-color:var(--forest-mid);background:#fff;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .hint{font-size:12px;color:var(--sub);margin-top:5px;}

  .agree-box{border:1px solid var(--line);border-radius:8px;padding:16px;margin:26px 0;background:var(--paper);}
  .agree-item{display:flex;align-items:center;gap:9px;font-size:13.5px;padding:6px 0;}
  .agree-item.all{border-bottom:1px solid var(--line);margin-bottom:6px;padding-bottom:12px;font-weight:700;}
  .agree-item a{margin-left:auto;color:var(--sub);font-size:12.5px;text-decoration:underline;}

  .submit-btn{width:100%;padding:15px;background:var(--forest-deep);color:#fff;border:none;border-radius:6px;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;}
  .submit-btn:hover{background:#16301f;}

  .login-link{text-align:center;font-size:13px;color:var(--sub);margin-top:18px;}
  .login-link a{color:var(--forest-mid);font-weight:700;}

  footer{background:var(--forest-deep);color:#cfd9d1;text-align:center;padding:22px;font-size:12.5px;}
</style>
</head>
