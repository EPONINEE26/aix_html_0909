<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>게시글 작성 - 소요림 리조트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --forest-deep:#1F3B2C;
    --forest-mid:#3F6B4F;
    --sand:#EFE8D8;
    --paper:#FBF9F4;
    --wood:#8B5E3C;
    --gold:#B98B2A;
    --ink:#232323;
    --sub:#6B6558;
    --line:#E1D8C4;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);}
  a{text-decoration:none;color:inherit;}

  .top{background:var(--forest-deep);color:#fff;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;}
  .top .logo{font-family:'Noto Serif KR',serif;font-size:17px;font-weight:700;}
  .top .logo span{color:var(--gold);}
  .top .close{font-size:13px;color:#cfd9d1;cursor:pointer;}

  .wrap{max-width:640px;margin:0 auto;padding:36px 28px 60px;}
  h1.page-title{font-family:'Noto Serif KR',serif;font-size:24px;margin:0 0 28px;}

  .field{margin-bottom:22px;}
  .field label{display:block;font-size:14px;font-weight:700;color:var(--forest-deep);margin-bottom:8px;}
  .field input[type="text"], .field textarea{
    width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:6px;
    font-size:14px;font-family:inherit;background:#fff;color:var(--ink);
  }
  .field input::placeholder, .field textarea::placeholder{color:#B7AF9C;}
  .field input:focus, .field textarea:focus{outline:none;border-color:var(--forest-mid);box-shadow:0 0 0 3px rgba(63,107,79,.12);}
  .field textarea{resize:vertical;min-height:220px;line-height:1.7;}

  .image-field .drop{
    border:1.5px dashed var(--line);border-radius:8px;padding:20px;
    display:flex;align-items:center;gap:16px;background:#fff;cursor:pointer;
  }
  .image-field .drop:hover{border-color:var(--forest-mid);}
  .thumb{width:84px;height:84px;border-radius:6px;object-fit:cover;flex-shrink:0;background:var(--sand);border:1px solid var(--line);}
  .drop-text{font-size:13.5px;color:var(--sub);}
  .drop-text b{color:var(--forest-deep);display:block;font-size:14px;margin-bottom:3px;}
  #fileInput{display:none;}

  .btn-row{display:flex;justify-content:center;gap:10px;margin-top:34px;}
  .btn{padding:12px 30px;border-radius:6px;font-size:14.5px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);}
  .btn.primary{background:var(--wood);color:#fff;border-color:var(--wood);}
  .btn.primary:hover{background:#734b2e;}
  .btn:not(.primary):hover{background:var(--sand);}

  /* Lightbox popup for image preview */
  .lightbox-overlay{
    position:fixed;inset:0;background:rgba(15,20,15,.72);
    display:none;align-items:center;justify-content:center;z-index:100;padding:24px;
  }
  .lightbox-overlay.open{display:flex;}
  .lightbox-box{background:#fff;border-radius:10px;max-width:560px;width:100%;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.35);}
  .lightbox-box img{width:100%;max-height:60vh;object-fit:contain;background:#111;display:block;}
  .lightbox-foot{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;}
  .lightbox-foot .name{font-size:13px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:340px;}
  .lightbox-foot button{border:none;background:var(--forest-deep);color:#fff;padding:9px 20px;border-radius:6px;font-size:13.5px;font-weight:700;cursor:pointer;}
</style>
</head>

</div>

<script>
  const fileInput = document.getElementById('fileInput');
  const thumb = document.getElementById('thumbPreview');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxName = document.getElementById('lightboxName');

  // Clicking the thumbnail area opens the file picker; once a file is chosen,
  // its preview pops up automatically so writing continues with the image visible.
  fileInput.addEventListener('change', function(){
    const file = this.files && this.files[0];
    if(!file) return;
    const url = URL.createObjectURL(file);
    thumb.src = url;
    lightboxImg.src = url;
    lightboxName.textContent = file.name;
    lightbox.classList.add('open');
  });

  // Also let people re-open the popup by clicking the thumbnail directly (not just choosing a new file)
  thumb.addEventListener('click', function(e){
    e.stopPropagation();
    lightboxImg.src = thumb.src;
    lightbox.classList.add('open');
  });

  lightbox.addEventListener('click', function(e){
    if(e.target === lightbox) lightbox.classList.remove('open');
  });
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 작성</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; margin: 40px; background-color: #fff; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { font-size: 24px; font-weight: bold; margin-bottom: 30px; color: #000; }
        .form-group { margin-bottom: 25px; }
        .form-group label { display: block; font-size: 15px; font-weight: bold; margin-bottom: 10px; color: #000; }
        .form-group input[type="text"], .form-group textarea {
            width: 100%; padding: 12px; border: 1px solid #dbdbdb; border-radius: 4px; box-sizing: border-box; font-size: 14px; color: #333;
        }
        .form-group input::placeholder, .form-group textarea::placeholder { color: #b5b5b5; }
        .form-group textarea { height: 300px; resize: vertical; }
        .form-group input[type="file"] { margin-top: 5px; }
        .btn-container { margin-top: 30px; display: flex; gap: 8px; }
        .btn { padding: 8px 18px; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; text-decoration: none; font-weight: 500; }
        .btn-primary { background-color: #3b5998; color: white; }
        .btn-secondary { background-color: #4a5568; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>게시글 작성</h1>
        <form action="list.html" onsubmit="alert('등록되었습니다.');">
            <div class="form-group">
                <label>제목</label>
                <input type="text" placeholder="제목을 입력해 주세요" required>
            </div>
            <div class="form-group">
                <label>작성자</label>
                <input type="text" placeholder="이름을 입력해 주세요" required>
            </div>
            <div class="form-group">
                <label>TAG</label>
                <input type="text" placeholder="태그를 입력해 주세요">
            </div>
            <div class="form-group">
                <label>내용</label>
                <textarea placeholder="내용을 입력해 주세요" required></textarea>
            </div>
            <div class="form-group">
                <label>이미지 첨부</label>
                <input type="file" accept="image/*">
            </div>
            <div class="btn-container">
                <button type="submit" class="btn btn-primary">등록</button>
                <a href="list.html" class="btn btn-secondary">목록</a>
                <button type="button" class="btn btn-secondary" onclick="history.back();">수정</button>
                <button type="button" class="btn btn-secondary" onclick="alert('삭제 권한이 없습니다.');">삭제</button>
                <button type="button" class="btn btn-secondary" onclick="alert('답변 기능 준비 중입니다.');">답변달기</button>
            </div>
        </form>
    </div>
</body>
</html>
