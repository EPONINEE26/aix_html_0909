<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>현재잔액</h2>
    <h2 id="money">200000</h2>

    <input type="text" name="num" id="num">
    <button type="button" onclick="btn()">확인</button>
    <script>
        function btn() {
            var money = document.getElementById("money").innerText; 
            console.log("머니 : ", money) 

        let a = Number(document.getElementById("num").value);
        console.log("입력한 숫자 : ", a);

        if (a > 10) { 
            document.write("10보다 큰수입니다.");
        } else {
            document.write("10보다 작은수입니다."); 
        }
    } 
    </script>
</body>
</html>
