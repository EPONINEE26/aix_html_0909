<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="http://code.jquery.com/jquery-latest.min.js"></script>
    <title>Document</title>
    <style>
        #txt{width: 200px; height: 40px; border: 1px solid black; text-align: center; line-height: 40px;}
    </style>
    <script>
        $(function(){
            $("#saveBtn").click(function(){
                var kor = $("#kor").val();
                $("#txt").text(kor);
            }); // saveBtn 구문 

            $("#conBtn").mouseover(function(){
                var h = $("#img1").attr("src"); 
                $("#txt").text(h);     
                $("#img1").attr("src","images/ff2.jpg");
                $("#img1").css("border", "10px solid black");
                // $("#conBtn").click(function(){
                //var h = $(".h2").attr("class"); // 속성 값 가져오는 기능 
                // $("#txt").text(h);
             }); // conBtn 구문 
                
            $("#conBtn").mouseout(function(){
                $("#img1").attr("src","images/ff.jpg");             
                $("#img1").attr("src","images/ff2.jpg"); 
            }); 
                
            $("#conBtn").mouseover(function(){
                $("#img1").attr("src","images/ff2.jpg");             
                $("#img1").attr("src","images/ff.jpg"); 
            }); 


            $("#img").mouseout(function(){
                $("#img1").attr("src","images/ff2.jpg");             
                $("#img1").attr("src","images/ff.jpg"); 
            }); 
                
            $("#img").mouseover(function(){
            $("#img1").attr("src","images/ff.jpg");             
                $("#img1").attr("src","images/ff2.jpg"); 
            }); // img 구문 


        });   // 제이쿼리 구문 
    </script>

</head>
<body>
    <h1 id="h1">안녕하세요</h1>
    <h2 class="h2">12345</h2>
    <input type="text" name="kor" id="kor"><br>
    <button type="button" id="saveBtn">저장</button>
    <button type="button" id="conBtn">확인</button>
    <div id="txt">0</div>
    <img id="img1" src="images/ff.jpg">
</body>
</html>
