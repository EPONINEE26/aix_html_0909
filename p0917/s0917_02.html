<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>


    </style>
</head>
<body>
    <script>
        // input 으로만 정보를 입력받는다. prompt는 token 키가 없기에 사용을 잘 하지 않음 
        // form폼 : csrf token -> 서버에서 토큰키를 발급해서 처리 해킹 방지를 위헤 token 키 발급받아 처리 
        // 서버에서 보내준 form 인지 확인함 
        var a = Number (prompt("숫자를 입력하세요."));
        if (a>0){
            document.write("양수");
        }else if(a==0) { 
            document.write("0");
        }else {
            document.write("음수");
        }

        // 한줄로도 쓸 수 있으나 명령어가 1개만 있을 때 가능 
        if (a>0) document.write("양수");
        else if(a==0) document.write("0");
        else document.write("음수");

        //alert(a);
    </script>
</body>
</html>
